name: tool_activitydates
summary: 'An admin tool that bulk-schedules activity open and close dates, and gradebook lock dates, across a course on a timed-session basis.'
description: |
  Pick a set of same-type activities (quizzes, choices, feedback, SCORM
  packages — any module whose instance table has `timeopen`/`timeclose`
  columns), split them into sessions, and write each session's window straight
  into the modules' own dates. Students get native "Opens:/Closes:" display
  and calendar events; no availability restrictions involved.

  A Grade locks section on the same page schedules gradebook lock dates on
  the same sessions. It writes each grade item's native "lock after" date,
  and core's grade cron task applies the lock. Optional notes tell students
  when an activity's grades lock. It replaces the discontinued
  tool_timelocker.
labels:
  # Required disclosure labels — pick all that apply (RFC §4.7):
  #   fully-free | freemium | paid-service | external-account
  #   donation-supported | commercial-support-available
  - fully-free
